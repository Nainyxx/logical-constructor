name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: logical-constructor.exe
          - os: ubuntu-latest
            file: logical-constructor.AppImage
          - os: macos-latest
            file: logical-constructor.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: cons-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cons-front/package-lock.json

      - run: npm ci
      - run: npx vite build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: cons-front/release/${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "Актуальная сборка" \
            --notes "Автоматическая сборка из коммита ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
